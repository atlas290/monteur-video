<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Motion Studio Pro</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button,input,textarea,select{font:inherit;color:inherit;background:none;border:none;outline:none;-webkit-appearance:none;appearance:none;border-radius:0}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
select{-webkit-appearance:menulist;appearance:menulist}
img{display:block;max-width:100%}

:root{
  --bg:#0a0a0a;
  --surface:#141414;
  --surface2:#1c1c1c;
  --border:#262626;
  --text:#f5f5f5;
  --muted:#8a8a8a;
  --gold:#c9a961;
}

html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body{overflow-x:hidden}

#editor{min-height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.header{padding:26px 20px 18px;text-align:center;border-bottom:1px solid var(--border)}
.header h1{font-size:15px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.header p{font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.06em}

.section{padding:20px;border-bottom:1px solid var(--border)}
.section h2{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.field-label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}

textarea{width:100%;font-size:16px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:12px 14px;min-height:100px;line-height:1.5;resize:vertical;transition:border-color .2s}
textarea:focus{border-color:var(--gold)}

.file-btn{display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;font-size:15px;color:var(--text);transition:border-color .2s,background .2s}
.file-btn:active{background:var(--surface2);border-color:var(--gold)}
.file-btn.has-file{border-color:var(--gold);color:var(--gold)}
.file-meta{font-size:12px;color:var(--muted);margin-top:8px;text-align:center;word-break:break-all}

input[type=file]{display:none}

.trim-row{display:flex;gap:10px;margin-top:12px}
.trim-col{flex:1}
.trim-col label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.trim-col input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:16px;color:var(--text);text-align:center}

.actions{padding:20px;display:flex;flex-direction:column;gap:10px;margin-top:auto}
.btn-primary,.btn-secondary,.btn-brain{min-height:52px;border-radius:12px;font-size:15px;font-weight:600;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;transition:transform .12s,opacity .2s;-webkit-tap-highlight-color:transparent}
.btn-primary{background:var(--gold);color:#0a0a0a}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn-brain{background:linear-gradient(135deg,rgba(201,169,97,.2),rgba(201,169,97,.06));border:1px solid rgba(201,169,97,.45);color:var(--gold);gap:8px}
.btn-primary:active,.btn-secondary:active,.btn-brain:active{transform:scale(.98)}
.btn-primary:disabled,.btn-secondary:disabled{opacity:.4}

#stage{position:fixed;inset:0;width:100vw;height:100dvh;background:#000;overflow:hidden;display:none;z-index:1000}
#stage.on{display:block}

#bgGradient{position:absolute;inset:0;background:radial-gradient(circle at 30% 20%, #1e1e1e, #0a0a0a 70%);animation:bgDrift 18s ease-in-out infinite alternate}
@keyframes bgDrift{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.08) translate(-2%,-1%)}}

#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.18) 100%)}

#phraseLayer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:8vmin;pointer-events:none}
#phraseText{font-size:clamp(28px,7.5vmin,64px);line-height:1.15;font-weight:600;letter-spacing:-.02em;text-align:center;max-width:92%;will-change:transform,opacity;opacity:0;transition:opacity .2s, transform .2s}
#phraseText.in{opacity:1;transform:scale(1)}

#closeStage{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:14px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;z-index:30;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#stage.recording #closeStage{display:none}

#progress{position:absolute;bottom:0;left:0;height:2px;background:var(--gold);width:0;z-index:5}

#startOverlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(0,0,0,.92);z-index:20;padding:20px;text-align:center}
#startOverlay.on{display:flex}
#startPlayBtn{width:88px;height:88px;border-radius:50%;background:var(--gold);color:#0a0a0a;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;-webkit-tap-highlight-color:transparent}
#startHelp{font-size:13px;color:var(--muted);max-width:280px;line-height:1.5}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%) translateY(20px);background:#222;color:#fff;font-size:13px;padding:10px 16px;border-radius:20px;opacity:0;transition:opacity .25s,transform .25s;z-index:2000;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="editor">
  <div class="header">
    <h1>Motion Studio Pro</h1>
    <p>Synchronisation par analyse vocale</p>
  </div>

  <div class="section">
    <h2>1. Voix off et Découpe</h2>
    <label class="file-btn" id="audioBtn" for="audioInput">Choisir un fichier audio</label>
    <input type="file" id="audioInput">
    <div class="file-meta" id="audioMeta">Aucun audio charge</div>
    
    <div class="trim-row" id="trimControls" style="display:none;">
      <div class="trim-col">
        <label for="startTime">Début (sec)</label>
        <input type="number" id="startTime" value="0" min="0" step="1">
      </div>
      <div class="trim-col">
        <label for="endTime">Fin (sec)</label>
        <input type="number" id="endTime" value="0" min="0" step="1">
      </div>
    </div>
  </div>

  <div class="section">
    <h2>2. Texte</h2>
    <label class="field-label" for="textInput">Collez votre texte (1 phrase par ligne)</label>
    <textarea id="textInput" placeholder="L'IA analysera vos silences pour caler parfaitement ces phrases."></textarea>
  </div>

  <div class="actions">
    <button class="btn-brain" id="brainBtn">Analyser et Synchroniser</button>
    <button class="btn-primary" id="previewBtn">Apercu</button>
    <button class="btn-secondary" id="recordBtn">Mode Enregistrement</button>
  </div>
</div>

<div id="stage">
  <div id="bgGradient"></div>
  <div id="vignette"></div>
  <div id="phraseLayer"><div id="phraseText"></div></div>
  <div id="progress"></div>
  <div id="startOverlay">
    <button id="startPlayBtn">Demarrer</button>
    <p id="startHelp">Lancez l'enregistreur d'ecran iPhone, puis touchez Demarrer.</p>
  </div>
  <button id="closeStage" aria-label="Fermer">&times;</button>
</div>

<audio id="audioEl" preload="auto"></audio>
<div id="toast"></div>

<script>
(function(){
  'use strict';

  var state = {
    audioUrl: null,
    audioBuffer: null,
    duration: 0,
    startTime: 0,
    endTime: 0,
    phrases: [],
    timings: [],
    textColor: '#f5f0e6',
    bgColor: '#0a0a0a'
  };

  var audioEl = document.getElementById('audioEl');
  var stage = document.getElementById('stage');
  var phraseText = document.getElementById('phraseText');
  var progress = document.getElementById('progress');
  var toastEl = document.getElementById('toast');
  var startOverlay = document.getElementById('startOverlay');
  var rafId = null;
  var currentPhraseIdx = -1;

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function(){ toastEl.classList.remove('on'); }, 3000);
  }

  function formatTime(s){
    if(!s || !isFinite(s)){ return '0:00'; }
    var m = Math.floor(s/60), sec = Math.floor(s%60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  // ==========================================
  // CHARGEMENT DE L'AUDIO
  // ==========================================
  document.getElementById('audioInput').addEventListener('change', function(e){
    var f = e.target.files && e.target.files[0];
    if(!f){ return; }
    
    document.getElementById('audioMeta').textContent = f.name + ' (Analyse...)';
    document.getElementById('audioBtn').classList.add('has-file');
    document.getElementById('trimControls').style.display = 'flex';

    if(state.audioUrl){ URL.revokeObjectURL(state.audioUrl); }
    state.audioUrl = URL.createObjectURL(f);
    audioEl.src = state.audioUrl;
    audioEl.load();

    var reader = new FileReader();
    reader.onload = function(evt){
      var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      audioCtx.decodeAudioData(evt.target.result, function(buffer){
        state.audioBuffer = buffer;
        state.duration = buffer.duration;
        state.startTime = 0;
        state.endTime = buffer.duration;
        
        document.getElementById('audioMeta').textContent = f.name + ' (' + formatTime(state.duration) + ')';
        document.getElementById('startTime').value = 0;
        document.getElementById('endTime').value = Math.floor(state.duration);
        showToast('Audio pret pour l\'analyse.');
      }, function(err){
        document.getElementById('audioMeta').textContent = f.name + ' (Erreur de lecture)';
        showToast('Erreur : Safari ne lit pas ce format.');
      });
    };
    reader.readAsArrayBuffer(f);
  });

  // Mise à jour des temps de découpe
  document.getElementById('startTime').addEventListener('change', function(e){
    state.startTime = parseFloat(e.target.value) || 0;
  });
  document.getElementById('endTime').addEventListener('change', function(e){
    state.endTime = parseFloat(e.target.value) || 0;
  });

  // ==========================================
  // LE MOTEUR D'ANALYSE VOCALE
  // ==========================================
  
  document.getElementById('brainBtn').addEventListener('click', function(){
    if(!state.audioBuffer){
      showToast('Veuillez d\'abord charger un fichier audio.');
      return;
    }

    var start = parseFloat(document.getElementById('startTime').value) || 0;
    var end = parseFloat(document.getElementById('endTime').value) || state.duration;
    
    if(start >= end){
      showToast('Le temps de fin doit être plus grand que le début.');
      return;
    }
    if(end > state.duration) end = state.duration;

    state.startTime = start;
    state.endTime = end;
    
    var rawText = document.getElementById('textInput').value.trim();
    var phrases = [];
    if(rawText.length > 0){
      var lines = rawText.split('\n');
      for(var i=0; i<lines.length; i++){
        if(lines[i].trim().length > 0){
          phrases.push(lines[i].trim());
        }
      }
    } else {
      phrases = ["Analyse audio...", "Synchronisation...", "Termine."];
    }

    showToast('Analyse de la voix en cours...');

    setTimeout(function(){
      var data = state.audioBuffer.getChannelData(0);
      var sampleRate = state.audioBuffer.sampleRate;
      
      // On coupe les données selon le début et la fin choisis
      var startSample = Math.floor(start * sampleRate);
      var endSample = Math.floor(end * sampleRate);
      var audioSubset = data.subarray(startSample, endSample);
      
      var windowSize = Math.floor(sampleRate * 0.05); 
      var rmsArray = [];
      var totalRms = 0;
      
      for(var i=0; i<audioSubset.length; i+=windowSize){
        var sum = 0;
        var count = 0;
        for(var j=i; j<i+windowSize && j<audioSubset.length; j++){
          sum += audioSubset[j] * audioSubset[j];
          count++;
        }
        var rms = Math.sqrt(sum / count);
        // On ajoute le temps de début pour que les timings soient absolus
        rmsArray.push({ time: (i / sampleRate) + start, volume: rms });
        totalRms += rms;
      }
      
      var avgRms = totalRms / rmsArray.length;
      var threshold = avgRms * 1.5; 
      if(threshold < 0.01) threshold = 0.01;

      var speechSegments = [];
      var inSpeech = false;
      var startTime = 0;
      
      for(var k=0; k<rmsArray.length; k++){
        var point = rmsArray[k];
        if(point.volume > threshold && !inSpeech){
          inSpeech = true;
          startTime = point.time;
        } else if(point.volume <= threshold && inSpeech){
          inSpeech = false;
          if(point.time - startTime > 0.2){
            speechSegments.push({ start: startTime, end: point.time });
          }
        }
      }
      if(inSpeech){
        speechSegments.push({ start: startTime, end: end });
      }

      state.timings = [];
      if(speechSegments.length === 0){
        // Fallback : répartition classique sur la durée de l'extrait
        var extractDuration = end - start;
        var splitTime = extractDuration / phrases.length;
        for(var p=0; p<phrases.length; p++){
          state.timings.push({ 
            start: start + (p*splitTime), 
            end: start + ((p+1)*splitTime) 
          });
        }
      } else {
        var phraseIdx = 0;
        for(var s=0; s<speechSegments.length; s++){
          if(phraseIdx >= phrases.length) break;
          var seg = speechSegments[s];
          state.timings.push({ start: seg.start, end: seg.end });
          phraseIdx++;
        }
        // Au cas où on a plus de phrases que de segments
        while(phraseIdx < phrases.length){
          var lastEnd = state.timings.length > 0 ? state.timings[state.timings.length-1].end : end;
          state.timings.push({
            start: lastEnd + 0.5,
            end: lastEnd + 1.5
          });
          phraseIdx++;
        }
      }

      state.phrases = phrases;
      showToast('Synchronisation parfaite ! ' + state.timings.length + ' blocs cales.');
      
    }, 100);
  });

  // ==========================================
  // LECTURE ET FIN DE L'EXTRAIT
  // ==========================================
  
  function getCurrentPhraseIndex(t){
    var timings = state.timings;
    if(timings.length === 0){ return -1; }
    for(var i=0; i<timings.length; i++){
      if(t >= timings[i].start && t <= timings[i].end){ return i; }
    }
    return -1; 
  }

  function renderPhrase(idx){
    var phrase = state.phrases[idx];
    if(!phrase){
      phraseText.classList.remove('in');
      return;
    }
    
    if(phraseText.textContent !== phrase){
      phraseText.classList.remove('in');
      setTimeout(function(){
        phraseText.textContent = phrase;
        phraseText.classList.add('in');
      }, 150);
    } else {
      phraseText.classList.add('in');
    }
  }

  function tick(){
    var t = audioEl.currentTime;
    
    // On vérifie si on a atteint la fin de l'extrait
    if(t >= state.endTime){
      audioEl.pause();
      phraseText.classList.remove('in');
      if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
      return;
    }

    // Calcul de la barre de progression basée sur l'extrait
    var extractDuration = state.endTime - state.startTime;
    if(extractDuration > 0){
      var currentInExtract = t - state.startTime;
      progress.style.width = ((currentInExtract / extractDuration) * 100) + '%';
    }
    
    var idx = getCurrentPhraseIndex(t);
    
    if(idx !== currentPhraseIdx){
      currentPhraseIdx = idx;
      if(idx >= 0){
        renderPhrase(idx);
      } else {
        phraseText.classList.remove('in');
      }
    }
    
    if(!audioEl.paused && !audioEl.ended){
      rafId = requestAnimationFrame(tick);
    }
  }

  function beginPlayback(){
    audioEl.currentTime = state.startTime;
    audioEl.play().catch(function(){ 
      showToast('Touchez a nouveau pour lancer.'); 
    });
    rafId = requestAnimationFrame(tick);
  }

  function startPlayback(recording){
    if(!state.audioUrl || !state.audioBuffer){ showToast('Ajoutez un audio.'); return; }
    if(state.timings.length === 0){ showToast('Cliquez d\'abord sur Analyser.'); return; }

    stage.classList.add('on');
    if(recording){ stage.classList.add('recording'); }
    else { stage.classList.remove('recording'); }

    currentPhraseIdx = -1;
    phraseText.className = '';
    phraseText.textContent = '';
    progress.style.width = '0%';
    
    if(recording){
      startOverlay.classList.add('on');
    } else {
      startOverlay.classList.remove('on');
      beginPlayback();
    }
  }

  document.getElementById('previewBtn').addEventListener('click', function(){ startPlayback(false); });
  document.getElementById('recordBtn').addEventListener('click', function(){ startPlayback(true); });
  document.getElementById('startPlayBtn').addEventListener('click', function(){
    startOverlay.classList.remove('on');
    beginPlayback();
  });

  document.getElementById('closeStage').addEventListener('click', function(){
    audioEl.pause();
    if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
    startOverlay.classList.remove('on');
    stage.classList.remove('on');
    stage.classList.remove('recording');
  });

})();
</script>
</body>
</html>
