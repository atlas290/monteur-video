<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Motion Studio IA</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button,input,textarea,select{font:inherit;color:inherit;background:none;border:none;outline:none;-webkit-appearance:none;appearance:none;border-radius:0}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
select{-webkit-appearance:menulist;appearance:menulist}
img{display:block;max-width:100%}

:root{
  --bg:#0a0a0a;
  --surface:#141414;
  --surface2:#1c1c1c;
  --border:#262626;
  --text:#f5f5f5;
  --muted:#8a8a8a;
  --gold:#c9a961;
  --danger:#c96060;
}

html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body{overflow-x:hidden}

#editor{min-height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

.header{padding:26px 20px 18px;text-align:center;border-bottom:1px solid var(--border)}
.header h1{font-size:15px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.header p{font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.06em}

.section{padding:20px;border-bottom:1px solid var(--border)}
.section h2{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}

.field-label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
textarea{width:100%;font-size:16px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:12px 14px;min-height:120px;line-height:1.5;resize:vertical;transition:border-color .2s}
textarea:focus{border-color:var(--gold)}

.file-btn{display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;font-size:15px;color:var(--text);transition:border-color .2s,background .2s}
.file-btn:active{background:var(--surface2);border-color:var(--gold)}
.file-btn.has-file{border-color:var(--gold);color:var(--gold)}
.file-meta{font-size:12px;color:var(--muted);margin-top:8px;text-align:center;word-break:break-all}

input[type=file]{display:none}

.color-row{display:flex;gap:12px}
.color-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.color-item span{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
input[type=color]{width:100%;height:48px;border:1px solid var(--border);border-radius:10px;cursor:pointer;background:var(--surface);padding:4px;-webkit-appearance:none;appearance:none}

.anim-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.anim-btn{min-height:48px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font-size:14px;transition:all .2s;-webkit-tap-highlight-color:transparent}
.anim-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(201,169,97,.08)}

.img-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.img-item{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px}
.img-row{display:flex;align-items:center;gap:10px}
.img-row img{width:44px;height:44px;object-fit:cover;border-radius:6px;flex-shrink:0}
.img-row .name{flex:1;min-width:0;font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.img-row .remove{width:40px;height:40px;border-radius:8px;flex-shrink:0;background:var(--surface2);color:var(--danger);display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1}
.img-item select{width:100%;font-size:15px;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;min-height:44px}

.actions{padding:20px;display:flex;flex-direction:column;gap:10px;margin-top:auto}
.btn-primary,.btn-secondary,.btn-brain{min-height:52px;border-radius:12px;font-size:15px;font-weight:600;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;transition:transform .12s,opacity .2s;-webkit-tap-highlight-color:transparent}
.btn-primary{background:var(--gold);color:#0a0a0a}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn-brain{background:linear-gradient(135deg,rgba(201,169,97,.2),rgba(201,169,97,.06));border:1px solid rgba(201,169,97,.45);color:var(--gold);gap:8px}
.btn-primary:active,.btn-secondary:active,.btn-brain:active{transform:scale(.98)}
.btn-primary:disabled,.btn-secondary:disabled{opacity:.4}

#stage{position:fixed;inset:0;width:100vw;height:100dvh;background:#000;overflow:hidden;display:none;z-index:1000}
#stage.on{display:block}

.bg-layer{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s ease}
.bg-layer.show{opacity:1}

#bgGradient{position:absolute;inset:0;background:radial-gradient(circle at 30% 20%, #1e1e1e, #0a0a0a 70%);animation:bgDrift 18s ease-in-out infinite alternate}
@keyframes bgDrift{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.08) translate(-2%,-1%)}}

#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.-sp18) 100%)}

#phraseLayer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:8vminacing;pointer-events:none}
#phraseText{font-size:clamp(28px,7.5vmin,64px);line-height:1.15;font-weight:600;letter:-.02em;text-align:center;max-width:92%;will-change:transform,opacity}

.anim-fade{opacity:0}
.anim-fade.in{opacity:1;transition:opacity .9s ease}
.anim-slide{opacity:0;transform:translateY(24px)}
.anim-slide.in{opacity:1;transform:translateY(0);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.anim-scale{opacity:0;transform:scale(.94)}
.anim-scale.in{opacity:1;transform:scale(1);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.anim-type{opacity:1}

#closeStage{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:14px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;z-index:30;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#stage.recording #closeStage{display:none}

#progress{position:absolute;bottom:0;left:0;height:2px;background:var(--gold);width:0;z-index:5}

#startOverlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(0,0,0,.92);z-index:20;padding:20px;text-align:center}
#startOverlay.on{display:flex}
#startPlayBtn{width:88px;height:88px;border-radius:50%;background:var(--gold);color:#0a0a0a;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;-webkit-tap-highlight-color:transparent}
#startHelp{font-size:13px;color:var(--muted);max-width:280px;line-height:1.5}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%) translateY(20px);background:#222;color:#fff;font-size:13px;padding:10px 16px;border-radius:20px;opacity:0;transition:opacity .25s,transform .25s;z-index:2000;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="editor">
  <div class="header">
    <h1>Motion Studio</h1>
    <p>L'IA analyse. Vous validez.</p>
  </div>

  <div class="section">
    <h2>1. Voix off</h2>
    <label class="file-btn" id="audioBtn" for="audioInput">Choisir un fichier audio</label>
    <input type="file" id="audioInput">
    <div class="file-meta" id="audioMeta">Aucun audio charge</div>
  </div>

  <div class="section">
    <h2>2. Texte de la voix</h2>
    <label class="field-label" for="textInput">Collez votre texte entier (même en désordre)</label>
    <textarea id="textInput" placeholder="Collez votre texte ici. L'IA le decoupera et le synchronisera."></textarea>
  </div>

  <div class="section">
    <h2>3. Images (Optionnel)</h2>
    <label class="file-btn" for="imgInput">Ajouter des images</label>
    <input type="file" id="imgInput" accept="image/*" multiple>
    <div class="img-list" id="imgList"></div>
    <div class="file-meta" id="imgMeta" style="text-align:left;margin-top:10px">L'IA placera vos images automatiquement.</div>
  </div>

  <div class="section">
    <h2>4. Couleurs</h2>
    <div class="color-row">
      <div class="color-item">
        <input type="color" id="textColor" value="#f5f0e6">
        <span>Texte</span>
      </div>
      <div class="color-item">
        <input type="color" id="bgColor" value="#0a0a0a">
        <span>Fond</span>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn-brain" id="brainBtn"><span style="font-size:18px">&#10022;</span> Generer et Synchroniser (IA)</button>
    <button class="btn-primary" id="previewBtn">Apercu</button>
    <button class="btn-secondary" id="recordBtn">Mode Enregistrement</button>
  </div>
</div>

<div id="stage">
  <div id="bgGradient"></div>
  <div class="bg-layer" id="bgLayerA"></div>
  <div class="bg-layer" id="bgLayerB"></div>
  <div id="vignette"></div>
  <div id="phraseLayer"><div id="phraseText"></div></div>
  <div id="progress"></div>
  <div id="startOverlay">
    <button id="startPlayBtn">Demarrer</button>
    <p id="startHelp">Lancez l'enregistreur d'ecran iPhone, puis touchez Demarrer.</p>
  </div>
  <button id="closeStage" aria-label="Fermer">&times;</button>
</div>

<audio id="audioEl" preload="auto"></audio>
<div id="toast"></div>

<script>
(function(){
  'use strict';

  // ==========================================
  // 1. ETAT DE L'APPLICATION
  // ==========================================
  var state = {
    audioUrl: null,
    duration: 0,
    rawText: '',
    phrases: [],
    timings: [], // Calculé par l'IA
    images: [],
    textColor: '#f5f0e6',
    bgColor: '#0a0a0a',
    animation: 'fade'
  };

  var audioEl = document.getElementById('audioEl');
  var stage = document.getElementById('stage');
  var bgGradient = document.getElementById('bgGradient');
  var bgA = document.getElementById('bgLayerA');
  var bgB = document.getElementById('bgLayerB');
  var phraseText = document.getElementById('phraseText');
  var progress = document.getElementById('progress');
  var toastEl = document.getElementById('toast');
  var startOverlay = document.getElementById('startOverlay');

  var rafId = null;
  var currentPhraseIdx = -1;
  var currentImgUrl = null;
  var activeBg = 'A';
  var typewriterInterval = null;

  // ==========================================
  // 2. OUTILS ET UTILITAIRES
  // ==========================================
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function(){ toastEl.classList.remove('on'); }, 3000);
  }

  function formatTime(s){
    if(!s || !isFinite(s)){ return '0:00'; }
    var m = Math.floor(s/60), sec = Math.floor(s%60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function shade(hex, pct){
    var c = hex.replace('#','');
    if(c.length === 3){ c = c[0]+c[0]+c[1]+c[1]+c[2]+c[2]; }
    var r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
    var avg = (r+g+b)/3;
    var f = pct/100;
    if(avg > 128){
      r = Math.max(0, Math.round(r*(1-f))); g = Math.max(0, Math.round(g*(1-f))); b = Math.max(0, Math.round(b*(1-f)));
    } else {
      r = Math.min(255, Math.round(r + (255-r)*f)); g = Math.min(255, Math.round(g + (255-g)*f)); b = Math.min(255, Math.round(b + (255-b)*f));
    }
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  // ==========================================
  // 3. L'INTELLIGENCE ARTIFICIELLE (LE CERVEAU)
  // ==========================================
  
  // Etape A : Nettoyer et découper le texte
  function cleanAndSplitText(text){
    if(!text) return [];
    // Remplace les sauts de ligne multiples par un seul espace
    var clean = text.replace(/\n+/g, ' ').replace(/\s+/g, ' ').trim();
    // Sépare par ponctuation forte
    var sentences = clean.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [clean];
    return sentences.map(function(s){ return s.trim(); }).filter(function(s){ return s.length > 0; });
  }

  // Etape B : Calculer le "poids" de chaque phrase (la durée qu'elle prend à l'oral)
  function calculatePhraseWeights(phrases){
    var weights = [];
    for(var i=0; i<phrases.length; i++){
      var p = phrases[i];
      var baseWeight = p.length;
      // L'IA ajoute du temps pour les pauses humaines
      var commas = (p.match(/,/g) || []).length;
      var dots = (p.match(/\./g) || []).length;
      var exclaims = (p.match(/!/g) || []).length;
      var questions = (p.match(/\?/g) || []).length;
      // Formule de calcul (Simulation des respirations)
      var weight = baseWeight + (commas * 4) + (dots * 8) + (exclaims * 5) + (questions * 6);
      // Une phrase a toujours un temps minimum
      if(weight < 15) weight = 15; 
      weights.push(weight);
    }
    return weights;
  }

  // Etape C : Générer les temps de début et de fin (Synchronisation)
  function syncTimings(phrases, weights, totalDuration){
    var timings = [];
    var totalWeight = weights.reduce(function(a,b){ return a+b; }, 0);
    var currentTime = 0;
    
    for(var i=0; i<phrases.length; i++){
      var ratio = weights[i] / totalWeight;
      var duration = ratio * totalDuration;
      timings.push({
        start: currentTime,
        end: currentTime + duration
      });
      currentTime += duration;
    }
    return timings;
  }

  // Etape D : Choix de l'animation globale basée sur le texte
  function aiChooseAnimation(phrases){
    var totalChars = 0;
    var hasExclaim = 0;
    var hasQuestion = 0;
    
    for(var i=0; i<phrases.length; i++){
      totalChars += phrases[i].length;
      if(phrases[i].indexOf('!') > -1) hasExclaim++;
      if(phrases[i].indexOf('?') > -1) hasQuestion++;
    }
    var avgLen = totalChars / phrases.length;
    
    // Règles de décision de l'IA
    if(hasExclaim > 0) return 'scale'; // De l'énergie !
    if(hasQuestion > 0) return 'slide'; // Du mouvement
    if(avgLen > 80) return 'fade'; // Phrase longue, on laisse le temps de lire
    return 'type'; // Par défaut, dynamique
  }

  // Etape E : Placement intelligent des images
  function aiPlaceImages(images, phrasesCount){
    if(images.length === 0 || phrasesCount === 0) return;
    if(images.length === 1){
      images[0].startPhrase = 0;
      return;
    }
    for(var i=0; i<images.length; i++){
      var ratio = i / (images.length - 1);
      var idx = Math.round(ratio * (phrasesCount - 1));
      images[i].startPhrase = idx;
    }
  }

  // ==========================================
  // 4. INTERFACE UTILISATEUR ET CHARGEMENT
  // ==========================================

  document.getElementById('audioInput').addEventListener('change', function(e){
    var f = e.target.files && e.target.files[0];
    if(!f){ return; }
    
    document.getElementById('audioMeta').textContent = f.name + ' (Analyse...)';
    document.getElementById('audioBtn').classList.add('has-file');
    showToast('Chargement de l\'audio...');

    if(state.audioUrl){ URL.revokeObjectURL(state.audioUrl); }
    state.audioUrl = URL.createObjectURL(f);
    
    audioEl.src = state.audioUrl;
    
    // Forcer Safari à lire les métadonnées
    audioEl.load();
    
    var attemptCount = 0;
    var durationChecker = setInterval(function(){
      attemptCount++;
      if(audioEl.duration && isFinite(audioEl.duration) && audioEl.duration > 0){
        clearInterval(durationChecker);
        state.duration = audioEl.duration;
        document.getElementById('audioMeta').textContent = f.name + ' (' + formatTime(state.duration) + ')';
        showToast('Audio pret !');
      } else if(attemptCount > 15){
        clearInterval(durationChecker);
        document.getElementById('audioMeta').textContent = f.name + ' (Format non supporte)';
        showToast('Attention : Safari ne lit pas cet audio. Essayez un MP3 ou M4A.');
      }
    }, 300);
  });

  var imgListEl = document.getElementById('imgList');
  document.getElementById('imgInput').addEventListener('change', function(e){
    var files = e.target.files;
    if(!files || !files.length){ return; }
    
    for(var i=0; i<files.length; i++){
      var f = files[i];
      var url = URL.createObjectURL(f);
      state.images.push({ url: url, name: f.name, startPhrase: 0 });
    }
    renderImages();
    e.target.value = '';
    showToast(files.length + ' image(s) ajoutee(s) !');
  });

  function renderImages(){
    imgListEl.innerHTML = '';
    var meta = document.getElementById('imgMeta');
    if(state.images.length === 0){
      meta.textContent = 'L\'IA placera vos images automatiquement.';
      return;
    }
    meta.textContent = state.images.length + ' image(s) chargee(s). Vous pouvez forcer le depart si besoin.';
    
    for(var i=0; i<state.images.length; i++){
      (function(img, idx){
        var item = document.createElement('div');
        item.className = 'img-item';

        var row = document.createElement('div');
        row.className = 'img-row';
        
        var thumb = document.createElement('img');
        thumb.src = img.url;
        row.appendChild(thumb);

        var nameEl = document.createElement('div');
        nameEl.className = 'name';
        nameEl.textContent = img.name;
        row.appendChild(nameEl);

        var rm = document.createElement('button');
        rm.className = 'remove';
        rm.innerHTML = '&times;';
        rm.addEventListener('click', function(){
          URL.revokeObjectURL(img.url);
          state.images.splice(idx, 1);
          renderImages();
        });
        row.appendChild(rm);
        item.appendChild(row);

        var sel = document.createElement('select');
        var opts = '<option value="0">Laissez l\'IA decider</option>';
        for(var p=1; p<=state.phrases.length; p++){
          opts += '<option value="' + p + '">Afficher a la phrase ' + p + '</option>';
        }
        sel.innerHTML = opts;
        sel.value = String(img.startPhrase);
        sel.addEventListener('change', function(){
          img.startPhrase = parseInt(sel.value, 10) || 0;
        });
        item.appendChild(sel);

        imgListEl.appendChild(item);
      })(state.images[i], i);
    }
  }

  document.getElementById('textColor').addEventListener('input', function(e){ state.textColor = e.target.value; });
  document.getElementById('bgColor').addEventListener('input', function(e){ state.bgColor = e.target.value; });

  // ==========================================
  // 5. LE BOUTON DE GENERATION (L'ACTION DE L'IA)
  // ==========================================
  
  document.getElementById('brainBtn').addEventListener('click', function(){
    var raw = document.getElementById('textInput').value;
    if(!raw || raw.trim().length === 0){
      showToast('Ecrivez d\'abord un texte.');
      return;
    }
    if(state.duration <= 0){
      showToast('Ajoutez un fichier audio d\'abord.');
      return;
    }

    showToast('L\'IA analyse et synchronise...');

    // 1. Découpage
    state.phrases = cleanAndSplitText(raw);
    
    // 2. Calcul des poids de respiration
    var weights = calculatePhraseWeights(state.phrases);
    
    // 3. Synchronisation temporelle
    state.timings = syncTimings(state.phrases, weights, state.duration);
    
    // 4. Choix de l'animation
    var anim = aiChooseAnimation(state.phrases);
    state.animation = anim;
    
    // Mise à jour visuelle des boutons d'animation (même s'ils sont cachés, c'est pour la cohérence)
    var btns = document.querySelectorAll('.anim-btn');
    for(var b=0; b<btns.length; b++){
      if(btns[b].getAttribute('data-anim') === anim){
        btns[b].classList.add('active');
      } else {
        btns[b].classList.remove('active');
      }
    }

    // 5. Placement des images
    aiPlaceImages(state.images, state.phrases.length);
    
    // 6. Mise à jour de l'interface texte
    document.getElementById('textInput').value = state.phrases.join('\n');
    renderImages();

    setTimeout(function(){
      showToast('Synchronisation terminee ! ' + state.phrases.length + ' phrases.');
    }, 500);
  });

  // ==========================================
  // 6. MOTEUR DE LECTURE VIDEO/AUDIO
  // ==========================================
  
  function resetStage(){
    currentPhraseIdx = -1;
    currentImgUrl = null;
    activeBg = 'A';
    clearInterval(typewriterInterval);
    phraseText.textContent = '';
    phraseText.className = '';
    phraseText.style.color = state.textColor;
    bgGradient.style.background = 'radial-gradient(circle at 30% 20%, ' + shade(state.bgColor, 12) + ', ' + state.bgColor + ' 70%)';
    bgGradient.style.opacity = '1';
    bgA.className = 'bg-layer'; bgB.className = 'bg-layer';
    bgA.style.backgroundImage = ''; bgB.style.backgroundImage = '';
    progress.style.width = '0%';
    applyImageForPhrase(1);
  }

  function applyImageForPhrase(phraseIdx){
    var chosen = null;
    for(var i=0; i<state.images.length; i++){
      if(state.images[i].startPhrase <= phraseIdx){ chosen = state.images[i]; }
    }
    if(!chosen){
      if(currentImgUrl){
        currentImgUrl = null;
        bgGradient.style.opacity = '1';
        bgA.classList.remove('show'); bgB.classList.remove('show');
      }
      return;
    }
    if(chosen.url === currentImgUrl){ return; }
    currentImgUrl = chosen.url;
    var next, curr;
    if(activeBg === 'A'){ next = bgB; curr = bgA; activeBg = 'B'; }
    else { next = bgA; curr = bgB; activeBg = 'A'; }
    next.style.backgroundImage = 'url("' + chosen.url + '")';
    void next.offsetWidth;
    next.classList.add('show');
    curr.classList.remove('show');
    bgGradient.style.opacity = '0.35';
  }

  function getCurrentPhraseIndex(t){
    var timings = state.timings;
    if(timings.length === 0){ return -1; }
    for(var i=0; i<timings.length; i++){
      if(t >= timings[i].start && t < timings[i].end){ return i; }
    }
    if(t >= timings[timings.length-1].end){ return timings.length - 1; }
    return 0;
  }

  function renderPhrase(idx){
    var phrase = state.phrases[idx];
    if(!phrase){ return; }
    var t = state.timings[idx];
    var dur = Math.max(0.2, t.end - t.start);
    clearInterval(typewriterInterval);
    phraseText.style.color = state.textColor;

    if(state.animation === 'type'){
      phraseText.className = 'anim-type';
      phraseText.textContent = '';
      var i2 = 0;
      var step = Math.max(16, (dur / phrase.length) * 1000);
      typewriterInterval = setInterval(function(){
        i2++;
        if(i2 >= phrase.length){ clearInterval(typewriterInterval); }
        phraseText.textContent = phrase.substring(0, i2);
      }, step);
    } else {
      phraseText.className = 'anim-' + state.animation;
      phraseText.textContent = phrase;
      void phraseText.offsetWidth;
      phraseText.classList.add('in');
    }
  }

  function tick(){
    var t = audioEl.currentTime;
    if(state.duration > 0){
      progress.style.width = ((t / state.duration) * 100) + '%';
    }
    var idx = getCurrentPhraseIndex(t);
    if(idx !== currentPhraseIdx){
      currentPhraseIdx = idx;
      if(idx >= 0){
        renderPhrase(idx);
        applyImageForPhrase(idx + 1);
      }
    }
    if(!audioEl.paused && !audioEl.ended){
      rafId = requestAnimationFrame(tick);
    }
  }

  function beginPlayback(){
    audioEl.play().catch(function(){ 
      showToast('Touchez a nouveau pour lancer.'); 
    });
    rafId = requestAnimationFrame(tick);
  }

  function startPlayback(recording){
    if(!state.audioUrl){ showToast('Ajoutez un fichier audio.'); return; }
    if(state.phrases.length === 0){ showToast('Generez le texte avec l\'IA d\'abord.'); return; }

    stage.classList.add('on');
    if(recording){ stage.classList.add('recording'); }
    else { stage.classList.remove('recording'); }

    resetStage();
    audioEl.currentTime = 0;

    if(recording){
      startOverlay.classList.add('on');
    } else {
      startOverlay.classList.remove('on');
      beginPlayback();
    }
  }

  document.getElementById('previewBtn').addEventListener('click', function(){ startPlayback(false); });
  document.getElementById('recordBtn').addEventListener('click', function(){ startPlayback(true); });
  document.getElementById('startPlayBtn').addEventListener('click', function(){
    startOverlay.classList.remove('on');
    beginPlayback();
  });

  document.getElementById('closeStage').addEventListener('click', function(){
    audioEl.pause();
    audioEl.currentTime = 0;
    clearInterval(typewriterInterval);
    if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
    startOverlay.classList.remove('on');
    stage.classList.remove('on');
    stage.classList.remove('recording');
  });

})();
</script>
</body>
</html>
